; PlatformIO - BOOTLOADER IAP resident (projet independant du firmware applicatif).
;
; Image de 16 KB flashee UNE SEULE FOIS a 0x08000000 via le bootloader ROM
; (BOOT0 + RESET), puis plus jamais : elle recoit ensuite les mises a jour de
; l'application (a 0x08004000) par UART. Voir ../lib/IAP/iap_protocol.h.
;
; Build   : pio run           (dans ce dossier bootloader/)
; Flash   : maintenir BOOT0, tap RESET, relacher, puis pio run -t upload
;
; Reutilise CMSIS (startup + system + core) du projet parent via lib_extra_dirs.
; N'embarque NI FWlib NI FreeRTOS : le code accede aux registres directement.

[env:bootloader]
platform = ststm32
board = genericSTM32F103RC
board_build.mcu = stm32f103rct6
board_build.ldscript = STM32F103RC_BL.ld
upload_protocol = serial
upload_port = COM4
monitor_speed = 115200

build_flags =
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Wl,-Map,bl_output.map
    -I../lib/CMSIS
    -I../lib/IAP
    -Iinclude

lib_extra_dirs = ../lib
lib_deps = CMSIS
; chain+ : suit les #include reels a partir de src/ ; avec notre conf.h minimal
; il ne remonte pas jusqu'a FWlib.
lib_ldf_mode = chain+
