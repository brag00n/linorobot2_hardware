; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env]
platform = teensy
framework = arduino
upload_port = /dev/ttyACM0
upload_protocol = teensy-cli
board_microros_transport = serial
board_microros_distro = ${sysenv.ROS_DISTRO}
lib_deps =
   https://github.com/micro-ROS/micro_ros_platformio
   https://github.com/micro-ROS/micro_ros_arduino
   https://github.com/micro-ROS/micro_ros_utilities
build_flags = -I ../../config

[env:teensy41] 
board = teensy41

[env:bamboo_teensy40] 
board = teensy40
build_flags =
    -I ../../config
    -h
#upload_flag = -v -s

[env:teensy36]
board = teensy36
build_flags = 
    -I ../../config
    -llibc -lc

[env:teensy35]
board = teensy35
build_flags = 
    -I ../../config
    -llibc -lc

[env:teensy31] 
board = teensy31
board_build.f_cpu = 96000000L
build_flags = 
    -I ../../config
    -llibc -lc

[env:dev] 
board = teensy40
build_flags = 
    -I ../../config
    -D USE_DEV_CONFIG

[env:beebo] 
board = teensy31
board_build.f_cpu = 96000000L
build_flags = 
    -I ../../config
    -llibc -lc
    -D USE_BEEBO_CONFIG

[env:beebo_m] 
board = teensy31
board_build.f_cpu = 96000000L
build_flags = 
    -I ../../config
    -llibc -lc
    -D USE_BEEBO_M_CONFIG

[env:square]
board = teensy40
upload_port = /dev/linobase
build_flags =
    -I ../../config
    -D USE_SQUARE_CONFIG

; --- Robot #3 : Teensy parlant le protocole de trames binaires Bamboo (pas micro-ROS) ---
; Bascule de transport par build-flag, comme l'ESP32 : -D ENABLE_CONNECTOR_SERIAL_FRAME
; compile la branche SerialFrame (lib/_SerialFrame) EXCLUSIVE de micro-ROS.
[env:bamboo_teensy_serial]
board = teensy41                 ; permutable teensy40 selon la carte physique
lib_deps =                       ; OVERRIDE le [env] : micro-ROS NON compile/linke
; Le LDF (mode "chain" par defaut) suit les #include en IGNORANT les #ifdef -> il verrait
; le `#include "odometry.h"` de la branche micro-ROS et compilerait lib/odometry, qui tire
; micro_ros_utilities. On ignore explicitement odometry : en mode trames ce header est
; garde par #ifdef ENABLE_CONNECTOR_ROS -> jamais inclus a la vraie compilation. (Pas
; "chain+", qui casse la resolution de Raspi_MotorHAT.h dans lib/raspimotorhat.)
lib_ignore = odometry
build_flags =
    -I ../../config
    -D USE_BAMBOOV200_CONFIG     ; NODE/geometrie/pins/PID + MPU6050 + HAT UGeek (RASPIMOTORHAT)
    -D ENABLE_CONNECTOR_SERIAL_FRAME
