; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

;=== START Global options ===;
;--- Global options ---
[env]
platform = teensy
framework = arduino
upload_port = /dev/ttyACM0
upload_protocol = teensy-cli
board_microros_transport = serial
board_microros_distro = ${sysenv.ROS_DISTRO}
lib_deps =
   https://github.com/micro-ROS/micro_ros_platformio
   https://github.com/micro-ROS/micro_ros_arduino
   https://github.com/micro-ROS/micro_ros_utilities
build_flags = -I ../../config

;--- global teensy41 options ---
[env:teensy41] 
board = teensy41

;--- global teensy40 options ---
[env:teensy36]
board = teensy36
build_flags = 
    -I ../../config
    -llibc -lc

;--- global teensy35 options ---
[env:teensy35]
board = teensy35
build_flags = 
    -I ../../config
    -llibc -lc

;--- global teensy31 options ---
[env:teensy31] 
board = teensy31
board_build.f_cpu = 96000000L
build_flags = 
    -I ../../config
    -llibc -lc

;--- global develop options (for tests) ---
[env:dev] 
board = teensy40
build_flags = 
    -I ../../config
    -D USE_DEV_CONFIG
;=== END Global options ===;

;=== START Specific robots ===;
;--- Robot Bamboo version 2.0.0 ---
[env:bambooV200] 
board = teensy40
build_flags =
    -I ../../config
    -h
    -D USE_BAMBOOV200_CONFIG

;--- Robot beebo ---
[env:beebo] 
board = teensy31
board_build.f_cpu = 96000000L
build_flags = 
    -I ../../config
    -llibc -lc
    -D USE_BEEBO_CONFIG

;--- Robot beebo version m ---
[env:beebo_m] 
board = teensy31
board_build.f_cpu = 96000000L
build_flags = 
    -I ../../config
    -llibc -lc
    -D USE_BEEBO_M_CONFIG

;--- Robot square ---
[env:square] 
board = teensy40
upload_port = /dev/linobase
build_flags = 
    -I ../../config
    -D USE_SQUARE_CONFIG
;=== END Specific robots ===;
