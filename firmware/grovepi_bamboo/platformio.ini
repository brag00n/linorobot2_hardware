; PlatformIO Project Configuration - GrovePi+ v3.0 detournee en carte capteurs
;
; La GrovePi+ porte un ATmega328P + quartz 16 MHz : electriquement un Arduino Uno.
; On la reprogramme en carte capteurs autonome qui parle le MEME protocole de
; trames que la STM32 Bamboo (cf. ../stm32_bamboo/tools/ros_monitor.py), sur son
; UART, via un adaptateur USB<->serie (PL2303TA : GND/CTS/VCC/TXD/RXD/DTR).
;
; --- ETAPE 0 (Windows 11) : valider le PL2303TA -----------------------------
;   Beaucoup de PL2303(TA) sont bloques par le driver Prolific recent ("code 10,
;   contrefait"). Verifier dans le Gestionnaire de peripheriques qu'un COMx monte
;   SANS erreur avant tout flash. Repli : driver Prolific legacy 3.3.2.102.
;
; --- FLASH NOMINAL : bootloader Arduino + DTR (auto-reset) -------------------
;   Ne marche QUE si l'ATmega a un bootloader (optiboot/Arduino). A verifier
;   d'abord en LECTURE SEULE de la signature (aucune ecriture) :
;     avrdude -c arduino -p m328p -P COMx -b 115200
;   Signature 0x1E950F lue -> bootloader present -> `pio run -t upload` ci-dessous.
;   Timeout/sync error -> pas de bootloader -> voir [env:isp].
[env:grovepi]
platform = atmelavr
board = uno                 ; ATmega328P @ 16 MHz, bootloader Arduino, upload DTR
framework = arduino
upload_protocol = arduino
; Port COM du PL2303TA (Gestionnaire de peripheriques -> Ports COM & LPT).
upload_port = COM6
monitor_speed = 115200
build_flags =
    -DFW_VERSION_MAJOR=0
    -DFW_VERSION_MINOR=3
    -DFW_VERSION_PATCH=0

; --- FLASH PAR ISP (USBtinyISP) : voie retenue, PAS de bootloader -----------
;   Historique : cette GrovePi+ etait deja flashee par ISP (usbtiny) -- son
;   ATmega n'a jamais eu de bootloader serie exploitable (tentatives DTR/reset
;   manuel -> "not in sync: resp=0x00" a tous les debits). On garde donc l'ISP.
;
;   Cabler l'ICSP 6 broches du USBtinyISP (MISO/MOSI/SCK/RESET/VCC/GND ;
;   pin 1 = MISO = pad carre) sur l'ICSP de la carte, puis :
;     pio run -e isp -t fuses     ; ecrit lfuse/hfuse/efuse ci-dessous (1 fois)
;     pio run -e isp -t upload    ; flashe firmware.hex par ISP
;
;   Fuses : lfuse=0xFF (quartz ext. 16 MHz), efuse=0xFD (BOD 2.7 V), et surtout
;   hfuse=0xD9 -> BOOTRST DEProgramme : au reset le CPU va droit a 0x0000 (notre
;   code), sans dependre d'un bootloader. (L'ancien projet avait hfuse=0xDA =
;   BOOTRST programme -> reset detourne vers une zone boot vide = puce muette.)
;   SPIEN reste programme (bit5=0) -> l'ISP continue de fonctionner.
;
;   Sous Windows : le USBtinyISP a besoin d'un pilote WinUSB/libusbK (Zadig) pour
;   qu'avrdude le voie. Verifier sa presence (VID 1781 / PID 0C9F) avant flash.
[env:isp]
platform = atmelavr
board = uno
framework = arduino
upload_protocol = usbtiny    ; USBtinyISP (pas de -P port ni -b baud)
board_hardware.oscillator = external
board_fuses.lfuse = 0xFF
board_fuses.hfuse = 0xD9
board_fuses.efuse = 0xFD
monitor_speed = 115200
build_flags =
    -DFW_VERSION_MAJOR=0
    -DFW_VERSION_MINOR=3
    -DFW_VERSION_PATCH=0
