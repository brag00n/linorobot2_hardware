; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


; === START global configuration ===
[platformio]
default_envs = bamboov3-wirshare_generic_driver_board

[env]
platform = teensy
framework = arduino
    ; upload_port = /dev/ttyACM0
    ; upload_protocol = teensy-cli
    ; board_microros_transport = serial # or wifi
; board_microros_distro = ${sysenv.ROS_DISTRO}
lib_deps = 
;    https://github.com/micro-ROS/micro_ros_platformio
    mcauser/i2cdetect
    jrowberg/I2Cdevlib-Core
    jrowberg/I2Cdevlib-ADXL345
    jrowberg/I2Cdevlib-AK8975
    jrowberg/I2Cdevlib-HMC5843
    jrowberg/I2Cdevlib-HMC5883L
    jrowberg/I2Cdevlib-ITG3200
    jrowberg/I2Cdevlib-MPU6050
    https://github.com/dthain/QMC5883L
    https://github.com/wollewald/INA219_WE
    https://github.com/arcao/Syslog
    SPI
    adafruit/Adafruit BusIO
    adafruit/Adafruit PWM Servo Driver Library
build_flags = -I ../config

[env:teensy41]
board = teensy41
; board_microros_user_meta = action.meta

[env:teensy40]
board = teensy40
; board_microros_user_meta = action.meta

[env:teensy36]
board = teensy36
build_flags =
    -I ../config
    -llibc -lc

[env:teensy35]
board = teensy35
build_flags =
    -I ../config
    -llibc -lc

[env:teensy31]
board = teensy31
board_build.f_cpu = 96000000L
build_flags =
    -I ../config
    -llibc -lc

; === END global configuration ===

; ==== START Bamboo configuration ====
[env:bamboov3-wirshare_generic_driver_board]
platform = espressif32
board = esp32dev

monitor_speed = 921600
    ; monitor_port = /dev/ttyACM0
    ; upload_port = /dev/ttyACM0
    ; upload_protocol = esptool
lib_deps =
    ${env.lib_deps}
    #for encoder
    madhephaestus/ESP32Encoder
    # For oled
    adafruit/Adafruit SSD1306@^2.5.13
    bblanchon/ArduinoJson@^7.3.1
    ; used for disabling Micro-ROS (ROS structure simulation)
    espressif/esp-boost@^0.1.1

; for OTA
upload_protocol = espota
upload_port = 192.168.1.88
upload_flags =
    --host_port=34343 ; fixed for docker build else random 10000-60000 if not fixed
;    --auth = A01#B02#C03
;    --port = 3232 ; ESP32 ota Port. Default 3232 

build_flags =

    -I ../../config
    -I include
    -D USE_BAMBOOV310_CONFIG

    -D ENABLE_SYSLOG
    -D USE_ARDUINO_OTA
    -I lib/_Connectors
    -D __PGMSPACE_H_
    -D WIFI_AP_SSID=\"bamboo\"
    -D WIFI_AP_PASSWORD=\"A01#B02#C03\"
    -D WIFI_STA_SSID=\"tiol01\"
    -D WIFI_STA_PASSWORD=\"AAAABBBBCCCCDDDD\"
;   -D USE_ESP32S3_WIFI_CONFIG
;   -D CONFIG_TINYUSB_CDC_ENABLED
    ; used for disabling Micro-ROS (used by esp-boost)
    -D CONFIG_COMPILER_CXX_RTTI

[env:bamboov3-wirshare_generic_driver_board-micro_ros]
platform = espressif32
board = esp32dev

monitor_speed = 921600
    ; monitor_port = /dev/ttyACM0
    ; upload_port = /dev/ttyACM0
    ; upload_protocol = esptool
lib_deps =
    ${env.lib_deps}
    #for encoder
    madhephaestus/ESP32Encoder
    # For oled
    adafruit/Adafruit SSD1306@^2.5.13
    bblanchon/ArduinoJson@^7.3.1

    ; used for Micro-ROS
    https://github.com/micro-ROS/micro_ros_platformio
    xopxe/micro_rosso@^0.3.1

; for OTA
upload_protocol = espota
upload_port = 192.168.1.88
upload_flags =
    --host_port = 34343 ; random 10000-60000 if not fixed
;    --auth = A01#B02#C03
;    --port = 3232 ; ESP32 ota Port. Default 3232 

build_flags =

    -I ../../config
    -D USE_BAMBOOV310_CONFIG

    -D ENABLE_SYSLOG
    -D USE_ARDUINO_OTA
    -I lib/_Connectors
    -D __PGMSPACE_H_
    -D ENABLE_MICRO_ROS
;    -D MICRO_ROS_TRANSPORT_ARDUINO_WIFI
    -D WIFI_AP_SSID=\"bamboo\"
    -D WIFI_AP_PASSWORD=\"A01#B02#C03\"
    -D WIFI_STA_SSID=\"tiol01\"
    -D WIFI_STA_PASSWORD=\"AAAABBBBCCCCDDDD\"

    ; used for disabling Micro-ROS (used by esp-boost)
    -D CONFIG_COMPILER_CXX_RTTI

[env:bamboov3-wirshare_generic_driver_board-micro_ros_old]
platform = espressif32
board = esp32dev
; board_build.f_flash = 80000000L
; board_build.flash_mode = qio
; board_build.partitions = min_spiffs.csv
monitor_speed = 921600
monitor_port = /dev/ttyACM0
upload_port = /dev/ttyACM0
upload_protocol = esptool
; upload_protocol = espota
; upload_port = 192.168.1.101

; board_microros_transport = wifi
; board_microros_distro = humble
; board_microros_user_meta = action.meta
board_microros_transport = serial
board_microros_distro = ${sysenv.ROS_DISTRO}
lib_deps =
    ${env.lib_deps}
    https://github.com/micro-ROS/micro_ros_platformio
    xopxe/micro_rosso@^0.3.1
    madhephaestus/ESP32Encoder
build_flags =
    -I ../../config
    -I include
    -I lib/_Connectors
    -D USE_BAMBOOV310_CONFIG
    -D ARDUINO_USB_CDC_ON_BOOT
    -D __PGMSPACE_H_
    -D USE_ESP32S3_WIFI_CONFIG
    -D ENABLE_MICRO_ROS
    -D WIFI_AP_SSID=\"bamboo\"
    -D WIFI_AP_PASSWORD=\"A01#B02#C03\"
    -D WIFI_STA_SSID=\"<SSID>\"
    -D WIFI_STA_PASSWORD=\"<PASSWORD>\"
;   -D _WIN32
; ==== END Bamboo configuration ====

